<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 378" role="img" aria-label="Pictograms for kami-ichidan verbs">
  <style>
    .vi-l { fill:none; stroke:#24364f; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .vi-a { fill:none; stroke:#b3262d; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .vi-f { fill:#24364f; stroke:none; }
    .vi-fa { fill:#b3262d; stroke:none; }
    .vi-card { fill:#f4f6f9; stroke:#dfe3ea; stroke-width:1.5; }
    .vi-kanji { font-size:17px; font-weight:bold; fill:#24364f; text-anchor:middle; }
    .vi-rd { font-size:10px; fill:#666; text-anchor:middle; }
    .vi-mn { font-size:9px; fill:#666; font-style:italic; text-anchor:middle; }

  </style>

  <g transform="translate(10,10)">
    <rect class="vi-card" x="0" y="0" width="150" height="172" rx="10"/>
