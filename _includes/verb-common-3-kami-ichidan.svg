<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 818 192" role="img" aria-label="Pictograms for kami-ichidan verbs">
  <style>
    .vi-l { fill:none; stroke:#24364f; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
