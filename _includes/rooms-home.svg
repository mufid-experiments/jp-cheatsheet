  <text class="rh-en" x="195" y="235">kitchen</text>
  <rect x="150" y="242" width="24" height="38" rx="2" fill="#dfe7ef" stroke="#24364f" stroke-width="1.3"/>
  <path class="rh-line" d="M150 258h24M169 247v6M169 262v8"/>
  <rect x="182" y="258" width="60" height="22" fill="#c9a27a" stroke="#24364f" stroke-width="1.3"/>
  <rect x="190" y="254" width="18" height="4" fill="#24364f"/>
  <rect x="216" y="254" width="18" height="4" fill="#24364f"/>

  <!-- 居間 -->
  <text class="rh-jp" x="320" y="212">居間</text>
  <text class="rh-rd" x="320" y="224">いま</text>
  <text class="rh-en" x="320" y="235">living room</text>
  <rect x="262" y="248" width="14" height="32" rx="5" fill="#8fb3d9" stroke="#24364f" stroke-width="1.3"/>
  <rect x="262" y="262" width="58" height="18" rx="5" fill="#8fb3d9" stroke="#24364f" stroke-width="1.3"/>
  <rect x="346" y="250" width="34" height="20" rx="2" fill="#24364f"/>
  <rect x="349" y="253" width="28" height="14" fill="#5b8fc7"/>
  <rect x="354" y="270" width="24" height="10" fill="#c9a27a" stroke="#24364f" stroke-width="1.2"/>

