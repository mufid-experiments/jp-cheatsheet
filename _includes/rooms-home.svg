  <path class="rh-line" d="M118 258h18M118 269h18"/>
  <ellipse cx="85" cy="276" rx="7" ry="3.5" fill="#24364f"/>
  <ellipse cx="100" cy="276" rx="7" ry="3.5" fill="#24364f"/>

