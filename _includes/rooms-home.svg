  <text class="rh-jp" x="145" y="122">寝室</text>
  <text class="rh-rd" x="145" y="134">しんしつ</text>
  <text class="rh-en" x="145" y="145">bedroom</text>
  <rect x="78" y="172" width="70" height="10" rx="3" fill="#fff" stroke="#24364f" stroke-width="1.3"/>
  <rect x="76" y="160" width="6" height="28" rx="2" fill="#c9a27a" stroke="#24364f" stroke-width="1.2"/>
  <ellipse cx="92" cy="169" rx="8" ry="4" fill="#cdbbe0" stroke="#24364f" stroke-width="1"/>
  <rect x="84" y="182" width="62" height="5" fill="#8a7bb0"/>
  <rect x="160" y="174" width="18" height="14" rx="2" fill="#c9a27a" stroke="#24364f" stroke-width="1.2"/>
  <circle cx="169" cy="167" r="6" fill="#fff" stroke="#24364f" stroke-width="1.3"/>
  <path class="rh-line" d="M169 167v-3M169 167l2 1.5"/>

