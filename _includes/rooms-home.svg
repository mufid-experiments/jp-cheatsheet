  <text class="rh-rd" x="470" y="224">せんめんじょ</text>
  <text class="rh-en" x="470" y="235">washroom</text>
  <rect x="446" y="256" width="18" height="6" rx="2" fill="#fff" stroke="#24364f" stroke-width="1.3"/>
  <path class="rh-line" d="M455 262v18"/>
  <rect x="468" y="252" width="28" height="28" rx="2" fill="#dfe7ef" stroke="#24364f" stroke-width="1.3"/>
  <circle cx="482" cy="268" r="9" fill="#cfe3f3" stroke="#24364f" stroke-width="1.3"/>
  <circle cx="490" cy="256" r="1.6" fill="#24364f"/>

  <!-- 浴室 -->
  <text class="rh-jp" x="535" y="212">浴室</text>
  <text class="rh-rd" x="535" y="224">よくしつ</text>
  <text class="rh-en" x="535" y="235">bathroom</text>
  <rect x="507" y="258" width="56" height="22" rx="6" fill="#cfe3f3" stroke="#24364f" stroke-width="1.3"/>
  <path class="rh-line" d="M512 266q4-3 8 0t8 0 8 0 8 0 8 0 8 0"/>
  <path class="rh-line" d="M510 240v8h8"/>

  <!-- 車庫 -->
  <text class="rh-jp" x="620" y="220">車庫</text>
  <text class="rh-rd" x="620" y="232">しゃこ</text>
  <text class="rh-en" x="620" y="243">garage</text>
  <rect x="585" y="258" width="70" height="16" rx="5" fill="#5b8fc7" stroke="#24364f" stroke-width="1.3"/>
  <path d="M598 258l8-10h32l8 10z" fill="#8fb3d9" stroke="#24364f" stroke-width="1.3" stroke-linejoin="round"/>
  <circle cx="600" cy="275" r="6" fill="#24364f"/><circle cx="640" cy="275" r="6" fill="#24364f"/>

  <!-- 庭 -->
  <text class="rh-jp" x="735" y="146">庭</text>
  <text class="rh-rd" x="735" y="158">にわ ・ garden</text>
  <rect x="728" y="218" width="10" height="62" fill="#a77c52" stroke="#24364f" stroke-width="1.2"/>
  <circle cx="733" cy="206" r="22" fill="#6aa66a" stroke="#24364f" stroke-width="1.3"/>
  <circle cx="715" cy="218" r="14" fill="#6aa66a" stroke="#24364f" stroke-width="1.3"/>
  <circle cx="752" cy="218" r="14" fill="#6aa66a" stroke="#24364f" stroke-width="1.3"/>
  <circle cx="733" cy="209" r="17" fill="#6aa66a"/>
  <path class="rh-line" d="M692 280v-14M772 280v-18M786 280v-12"/>
  <circle cx="692" cy="264" r="4" fill="#b3262d"/>
  <circle cx="772" cy="260" r="4" fill="#f0c04d"/>
  <circle cx="786" cy="266" r="4" fill="#b3262d"/>
</svg>
