  <rect x="240" y="176" width="12" height="12" fill="#b3262d" stroke="#24364f" stroke-width="1.2"/>
  <rect x="254" y="176" width="12" height="12" fill="#5b8fc7" stroke="#24364f" stroke-width="1.2"/>
  <rect x="247" y="164" width="12" height="12" fill="#f0c04d" stroke="#24364f" stroke-width="1.2"/>
  <rect x="285" y="168" width="38" height="5" fill="#c9a27a" stroke="#24364f" stroke-width="1.2"/>
  <path class="rh-line" d="M288 173v15M320 173v15"/>

