<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 22 800 274" role="img" aria-label="Cutaway of a two-storey Japanese house with every room labelled in Japanese">
  <style>
    .rh-jp { font-size: 15px; font-weight: bold; fill: #24364f; text-anchor: middle; }
    .rh-jp.sm { font-size: 13px; }
    .rh-rd { font-size: 9px; fill: #666; text-anchor: middle; }
    .rh-en { font-size: 9px; fill: #666; text-anchor: middle; font-style: italic; }
    .rh-w  { fill: #fff; text-anchor: middle; }
    .rh-room { stroke: #24364f; stroke-width: 1.8; }
    .rh-line { fill: none; stroke: #24364f; stroke-width: 1.4; stroke-linecap: round; }
  </style>

  <!-- sky, sun, ground -->
  <circle cx="752" cy="52" r="24" fill="#b3262d"/>
  <rect x="0" y="280" width="800" height="26" fill="#dfe8d5"/>
  <line x1="0" y1="280" x2="800" y2="280" stroke="#24364f" stroke-width="2"/>

  <!-- floor tags -->
  <g>
    <rect x="8" y="128" width="50" height="38" rx="9" fill="#24364f"/>
    <text class="rh-w" x="33" y="145" font-size="14" font-weight="bold">二階</text>
    <text class="rh-w" x="33" y="159" font-size="10">2F</text>
    <rect x="8" y="218" width="50" height="38" rx="9" fill="#24364f"/>
    <text class="rh-w" x="33" y="235" font-size="14" font-weight="bold">一階</text>
    <text class="rh-w" x="33" y="249" font-size="10">1F</text>
  </g>

  <!-- 2F rooms -->
  <rect class="rh-room" x="70"  y="100" width="150" height="90" fill="#f3ecf7"/>
  <rect class="rh-room" x="220" y="100" width="120" height="90" fill="#fdf3dc"/>
  <rect class="rh-room" x="340" y="100" width="110" height="90" fill="#e8f1e4"/>
  <rect x="450" y="100" width="120" height="90" fill="#f4f6f9" stroke="#24364f" stroke-width="1.8" stroke-dasharray="5 4"/>

  <!-- 1F rooms -->
  <rect class="rh-room" x="70"  y="190" width="70"  height="90" fill="#f3e9df"/>
  <rect class="rh-room" x="140" y="190" width="110" height="90" fill="#fdf0ee"/>
  <rect class="rh-room" x="250" y="190" width="140" height="90" fill="#eef4fb"/>
  <rect class="rh-room" x="390" y="190" width="50"  height="90" fill="#f4f6f9"/>
  <rect class="rh-room" x="440" y="190" width="60"  height="90" fill="#e8f1e4"/>
  <rect class="rh-room" x="500" y="190" width="70"  height="90" fill="#e1eef8"/>

  <!-- garage + garden -->
  <rect class="rh-room" x="570" y="200" width="100" height="80" fill="#eceff3"/>
  <line x1="562" y1="200" x2="678" y2="200" stroke="#24364f" stroke-width="3" stroke-linecap="round"/>

  <!-- roof -->
  <polygon points="56,100 260,28 464,100" fill="#b3262d" stroke="#24364f" stroke-width="1.8" stroke-linejoin="round"/>
  <text class="rh-w" x="260" y="74" font-size="14" font-weight="bold">屋根</text>
  <text class="rh-w" x="260" y="86" font-size="8" opacity=".85">やね ・ roof</text>

