  <text class="rh-jp" x="395" y="122">書斎</text>
  <text class="rh-rd" x="395" y="134">しょさい</text>
  <text class="rh-en" x="395" y="145">study</text>
  <rect x="348" y="152" width="24" height="36" fill="#c9a27a" stroke="#24364f" stroke-width="1.3"/>
  <path class="rh-line" d="M348 164h24M348 176h24"/>
  <rect x="351" y="155" width="3" height="9" fill="#b3262d"/><rect x="356" y="156" width="3" height="8" fill="#5b8fc7"/><rect x="361" y="155" width="3" height="9" fill="#f0c04d"/>
  <rect x="351" y="167" width="3" height="9" fill="#5b8fc7"/><rect x="356" y="168" width="3" height="8" fill="#b3262d"/><rect x="361" y="167" width="4" height="9" fill="#24364f"/>
  <rect x="380" y="174" width="40" height="4" fill="#c9a27a" stroke="#24364f" stroke-width="1.2"/>
  <path class="rh-line" d="M384 178v10M416 178v10"/>
  <rect x="393" y="163" width="14" height="10" rx="1" fill="#dfe7ef" stroke="#24364f" stroke-width="1.2"/>

