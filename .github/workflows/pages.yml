name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true

      # The runner has no Japanese font, so Chrome prints kanji and kana as
      # empty boxes. "Noto Sans CJK JP" is in the font stack in base.css.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      # HTML + PDF for every topic, plus build/index.html. Chrome is preinstalled
      # on ubuntu-latest and found by bin/build as `google-chrome`.
      - run: bundle exec bin/build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    # Pull requests only prove that the site builds; they do not publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
