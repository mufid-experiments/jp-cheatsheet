name: Preview cheatsheets

# For a pull request: build every topics/*.md it adds or changes and attach
# <topic>.pdf and <topic>.html to the run as artifacts. They are uploaded
# unzipped (archive: false), so clicking one in the run's Artifacts list opens
# it in the browser.

on:
  pull_request:
    paths: ["topics/*.md"]

permissions:
  contents: read

# A new push to the pull request cancels the previews of the one before.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      topics: ${{ steps.diff.outputs.topics }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # the pull request's merge commit and both its parents

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"

      # The merge commit's first parent is the base branch, so this is what the
      # pull request changes. A deleted topic (--diff-filter=d) has no preview.
      - id: diff
        shell: ruby {0}
        run: |
          require "json"
          files = IO.popen(%w[git diff -z --name-only --diff-filter=d HEAD^1 HEAD -- topics/*.md], &:read)
          abort("git diff failed") unless $?.success?
          topics = files.split("\0").map { |f| File.basename(f, ".md") }
          File.write(ENV.fetch("GITHUB_OUTPUT"), "topics=#{topics.to_json}\n", mode: "a")

  preview:
    needs: changes
    if: needs.changes.outputs.topics != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        topic: ${{ fromJSON(needs.changes.outputs.topics) }}
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
          bundler-cache: true

      - run: bundle exec bin/build "$TOPIC"
        env:
          TOPIC: ${{ matrix.topic }}

      # With archive: false the artifact is the file itself, named after it.
      - uses: actions/upload-artifact@v7
        with:
          path: build/${{ matrix.topic }}.pdf
          archive: false

      - uses: actions/upload-artifact@v7
        with:
          path: build/${{ matrix.topic }}.html
          archive: false
