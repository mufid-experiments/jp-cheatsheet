  <title>{{ page.title }}{% if page.level %} ({{ page.level }}){% endif %}</title>
  <style>
{% include css/base.css %}
{% include css/header.css %}
{% include css/text.css %}
{% include css/tables.css %}
{% include css/callouts.css %}
{% include css/refs.css %}

</head>
<body>

      <div>

      <p class="level">{{ page.level }}</p>
    </header>
{{ content }}
  </main>
</body>
</html>
